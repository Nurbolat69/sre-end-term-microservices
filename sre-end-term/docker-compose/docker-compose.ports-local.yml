# Published ports when defaults are busy (other projects on same machine)
services:
  edge-router:
    ports:
      - '8888:80'
      - '8080:8080'
  prometheus:
    ports:
      - '9091:9090'
  alertmanager:
    ports:
      - '9094:9093'
  grafana:
    ports:
      - '3001:3000'
  nodeexporter:
    ports:
      - '9101:9100'
  cadvisor:
    ports:
      - '8082:8080'
  postgres-sre:
    ports:
      - '5433:5432'
  redis:
    ports:
      - '6380:6379'
