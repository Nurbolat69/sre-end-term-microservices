---
- name: Deploy Sock Shop via Docker Compose (full stack)
  hosts: local
  gather_facts: false
  vars:
    compose_file: docker-compose.full.yml
  tasks:
    - name: Pull images
      ansible.builtin.command:
        cmd: docker compose -f {{ compose_file }} pull
        chdir: "{{ compose_dir }}"
      changed_when: true

    - name: Start full stack (app + monitoring)
      ansible.builtin.command:
        cmd: docker compose -f {{ compose_file }} up -d
        chdir: "{{ compose_dir }}"
      register: compose_up
      changed_when: true

    - name: Wait for shop HTTP
      ansible.builtin.uri:
        url: http://localhost/
        status_code: [200, 301, 302]
      register: health
      until: health.status in [200, 301, 302]
      retries: 30
      delay: 5
      ignore_errors: true
