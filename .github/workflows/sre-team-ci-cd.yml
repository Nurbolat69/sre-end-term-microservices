# SRE End Term — Team CI/CD Pipeline
# Repository: https://github.com/Nurbolat69/sre-end-term-microservices

name: SRE Team CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'sre-end-term/**'
      - '.github/workflows/sre-team-ci-cd.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'sre-end-term/**'
      - '.github/workflows/sre-team-ci-cd.yml'
  workflow_dispatch:

concurrency:
  group: sre-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_DIR: sre-end-term/docker-compose
  TF_DIR: sre-end-term/terraform
  ANSIBLE_DIR: sre-end-term/ansible

jobs:
  # ---------------------------------------------------------------------------
  # CI — Continuous Integration (every PR and push)
  # ---------------------------------------------------------------------------
  validate-config:
    name: CI — Validate configs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sre-end-term
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose syntax
        run: |
          docker compose -f docker-compose/docker-compose.full.yml config --quiet
          docker compose -f docker-compose/docker-compose.full.yml \
            -f docker-compose/docker-compose.ports-default.yml config --quiet
          docker compose -f docker-compose/docker-compose.full.yml \
            -f docker-compose/docker-compose.incident.yml config --quiet

      - name: Validate Prometheus rules (promtool)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/sre-end-term/monitoring:/etc/prometheus" \
            prom/prometheus:v2.47.0 \
            promtool check rules /etc/prometheus/recording.rules
          docker run --rm -v "$GITHUB_WORKSPACE/sre-end-term/monitoring:/etc/prometheus" \
            prom/prometheus:v2.47.0 \
            promtool check rules /etc/prometheus/alert.rules

      - name: Validate Prometheus config
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/sre-end-term/monitoring:/etc/prometheus" \
            prom/prometheus:v2.47.0 \
            promtool check config /etc/prometheus/prometheus.yml

      - uses: imranismail/setup-kustomize@v2
      - name: Kustomize build
        run: kustomize build sre-end-term/kubernetes > /tmp/kustomize-out.yaml && test -s /tmp/kustomize-out.yaml

  terraform-validate:
    name: CI — Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sre-end-term/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init & validate
        run: |
          terraform init -backend=false
          terraform validate

  ansible-validate:
    name: CI — Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: pip install ansible

      - name: Syntax check playbooks
        working-directory: sre-end-term/ansible
        run: |
          ansible-playbook --syntax-check -i inventory/hosts.yml playbooks/site.yml
          ansible-playbook --syntax-check -i inventory/hosts.yml playbooks/deploy-compose.yml
          ansible-playbook --syntax-check -i inventory/hosts.yml playbooks/deploy-swarm.yml

  integration-smoke:
    name: CI — Integration smoke (monitoring stack)
    runs-on: ubuntu-latest
    needs: [validate-config, terraform-validate]
    steps:
      - uses: actions/checkout@v4

      - name: Start Prometheus + Alertmanager only
        working-directory: sre-end-term/docker-compose
        run: |
          docker compose -f docker-compose.full.yml \
            -f docker-compose.ports-default.yml up -d prometheus alertmanager
          sleep 20
          curl -sf http://localhost:9090/-/healthy
          curl -sf http://localhost:9093/-/ready

      - name: CI smoke script
        run: bash sre-end-term/ci/smoke.sh

      - name: Tear down
        if: always()
        working-directory: sre-end-term/docker-compose
        run: |
          docker compose -f docker-compose.full.yml \
            -f docker-compose.ports-default.yml down -v --remove-orphans

  sre-gate:
    name: CI — Quality gate
    runs-on: ubuntu-latest
    needs: [validate-config, terraform-validate, ansible-validate, integration-smoke]
    steps:
      - run: echo "All CI jobs passed — ready for CD / merge"

  # ---------------------------------------------------------------------------
  # CD — Continuous Delivery (main branch only)
  # ---------------------------------------------------------------------------
  cd-package:
    name: CD — Package release bundle
    runs-on: ubuntu-latest
    needs: [sre-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Create deployment artifact
        run: |
          mkdir -p dist
          tar -czf dist/sre-end-term-bundle.tar.gz sre-end-term \
            --exclude='sre-end-term/evidence' \
            --exclude='sre-end-term/.deploy-ports.env'
          sha256sum dist/sre-end-term-bundle.tar.gz > dist/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sre-end-term-release-${{ github.sha }}
          path: dist/
          retention-days: 30

  cd-summary:
    name: CD — Pipeline summary
    runs-on: ubuntu-latest
    needs: [cd-package]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - run: |
          echo "## CD Successful" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact: sre-end-term-bundle.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy locally: cd sre-end-term && ./scripts/deploy-compose.ps1" >> $GITHUB_STEP_SUMMARY
