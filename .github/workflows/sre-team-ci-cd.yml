# SRE End Term - Team CI/CD
# https://github.com/Nurbolat69/sre-end-term-microservices

name: SRE Team CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'sre-end-term/**'
      - '.github/workflows/sre-team-ci-cd.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'sre-end-term/**'
      - '.github/workflows/sre-team-ci-cd.yml'
  workflow_dispatch:

concurrency:
  group: sre-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-config:
    name: CI - Validate configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose
        working-directory: sre-end-term
        run: |
          docker compose -f docker-compose/docker-compose.full.yml config --quiet
          docker compose -f docker-compose/docker-compose.full.yml \
            -f docker-compose/docker-compose.ports-default.yml config --quiet
          docker compose -f docker-compose/docker-compose.full.yml \
            -f docker-compose/docker-compose.incident.yml config --quiet

      - name: Prometheus rules (promtool)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/sre-end-term/monitoring:/etc/prometheus" \
            prom/prometheus:v2.47.0 promtool check rules /etc/prometheus/recording.rules
          docker run --rm -v "$GITHUB_WORKSPACE/sre-end-term/monitoring:/etc/prometheus" \
            prom/prometheus:v2.47.0 promtool check rules /etc/prometheus/alert.rules

      - name: Prometheus config
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/sre-end-term/monitoring:/etc/prometheus" \
            prom/prometheus:v2.47.0 promtool check config /etc/prometheus/prometheus.yml

      - uses: imranismail/setup-kustomize@v2
      - name: Kustomize build
        working-directory: sre-end-term
        run: kustomize build kubernetes | tee /tmp/k8s.yaml | grep -q 'kind:'

      - name: Shellcheck CI scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck sre-end-term/ci/smoke.sh sre-end-term/ci/validate.sh

  terraform-validate:
    name: CI - Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sre-end-term/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - run: terraform fmt -check -recursive
      - run: |
          terraform init -backend=false
          terraform validate

  ansible-validate:
    name: CI - Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ansible
      - working-directory: sre-end-term/ansible
        run: |
          ansible-playbook --syntax-check -i inventory/hosts.yml playbooks/site.yml
          ansible-playbook --syntax-check -i inventory/hosts.yml playbooks/deploy-compose.yml
          ansible-playbook --syntax-check -i inventory/hosts.yml playbooks/deploy-swarm.yml
          ansible-playbook --syntax-check -i inventory/hosts.yml playbooks/deploy-kubernetes.yml

  integration-smoke:
    name: CI - Integration smoke
    runs-on: ubuntu-latest
    needs: [validate-config, terraform-validate]
    steps:
      - uses: actions/checkout@v4
      - name: Start monitoring stack
        working-directory: sre-end-term/docker-compose
        run: |
          docker compose -f docker-compose.full.yml \
            -f docker-compose.ports-default.yml up -d prometheus alertmanager
          for i in $(seq 1 30); do
            curl -sf http://localhost:9090/-/healthy && break
            sleep 2
          done
          curl -sf http://localhost:9093/-/ready
      - run: bash sre-end-term/ci/smoke.sh
      - name: Tear down
        if: always()
        working-directory: sre-end-term/docker-compose
        run: |
          docker compose -f docker-compose.full.yml \
            -f docker-compose.ports-default.yml down -v --remove-orphans

  sre-gate:
    name: CI - Quality gate
    runs-on: ubuntu-latest
    needs: [validate-config, terraform-validate, ansible-validate, integration-smoke]
    steps:
      - run: echo "All CI jobs passed"

  cd-package:
    name: CD - Release bundle
    runs-on: ubuntu-latest
    needs: [sre-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Package artifact
        run: |
          mkdir -p dist
          tar --exclude='sre-end-term/evidence' \
              --exclude='sre-end-term/.deploy-ports.env' \
              -czf dist/sre-end-term-bundle.tar.gz sre-end-term
          sha256sum dist/sre-end-term-bundle.tar.gz > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sre-end-term-${{ github.sha }}
          path: dist/
          retention-days: 30

  cd-summary:
    name: CD - Summary
    runs-on: ubuntu-latest
    needs: [cd-package]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - run: |
          echo "## SRE CD OK" >> $GITHUB_STEP_SUMMARY
          echo "Artifact: sre-end-term-bundle.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "Repo: https://github.com/Nurbolat69/sre-end-term-microservices" >> $GITHUB_STEP_SUMMARY
